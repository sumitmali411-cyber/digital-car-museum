server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/autovault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: sam9311
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/autovault
          jwk-set-uri: http://localhost:8180/realms/autovault/protocol/openid-connect/certs

autovault:
  storage:
    models-path: ./storage/models
    images-path: ./storage/images
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/autovault?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/autovault
          jwk-set-uri: http://keycloak:8080/realms/autovault/protocol/openid-connect/certs

---
spring:
  config:
    activate:
      on-profile: seed
  jpa:
    hibernate:
      ddl-auto: validate
