server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/autovault?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # No default: a missing value must fail startup, never fall back to a
    # password that is readable in this repository.
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/autovault}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/autovault/protocol/openid-connect/certs}

autovault:
  storage:
    models-path: ./storage/models
    images-path: ./storage/images
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Swagger UI and api-docs are permitAll and publish the whole API surface.
# Set SWAGGER_ENABLED=false on any deployed environment.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/autovault?createDatabaseIfNotExist=true&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/autovault
          jwk-set-uri: http://keycloak:8080/realms/autovault/protocol/openid-connect/certs

---
spring:
  config:
    activate:
      on-profile: seed
  jpa:
    hibernate:
      ddl-auto: validate
